<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FSQ v0.1.0 Demo</title>
    <meta name="description" content="FSQ v0.1.0 evidence-first AI UI automation demo.">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --panel: #ffffff;
        --text: #242428;
        --muted: #62636b;
        --border: #dedee5;
        --accent: #6750d8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111114;
          --panel: #1b1b20;
          --text: #f2f2f5;
          --muted: #b6b6c0;
          --border: #32323a;
          --accent: #a99bff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 4.25rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }

      .video {
        overflow: hidden;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      a {
        color: var(--accent);
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>FSQ v0.1.0 Demo</h1>
        <p>Evidence-first AI UI automation: describe a goal, inspect evidence, review a candidate Case, replay deterministically, and open the static report.</p>
      </header>

      <div class="video" aria-label="FSQ v0.1.0 YouTube demo">
        <iframe src="https://www.youtube-nocookie.com/embed/QqCahxGDdS0?autoplay=1&mute=1&rel=0&modestbranding=1" title="FSQ v0.1.0 Demo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      <nav aria-label="Demo links">
        <a href="https://youtu.be/QqCahxGDdS0">Open on YouTube</a>
        <a href="media/demo.en.srt">English captions</a>
        <a href="media/demo.zh-CN.srt">中文字幕</a>
        <a href="../README.md">README</a>
        <a href="../README.zh-CN.md">中文 README</a>
      </nav>
    </main>
  </body>
</html>
