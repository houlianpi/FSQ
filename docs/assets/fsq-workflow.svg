<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FSQ evidence-first workflow</title>
  <desc id="desc">A goal enters AI exploration, produces evidence and verification, becomes a reviewable Case, and replays deterministically with fresh evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#20173d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="2">THE FSQ LOOP</text>
  <text x="64" y="114" fill="#fff" font-family="system-ui,sans-serif" font-size="30" font-weight="700">Explore with AI. Verify with evidence. Replay as a Case.</text>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <g transform="translate(64 162)"><rect width="174" height="104" rx="16" fill="#fff"/><text x="20" y="36" fill="#6d28d9" font-size="14" font-weight="700">01 · DESCRIBE</text><text x="20" y="72" fill="#111827" font-size="22" font-weight="700">Visible goal</text></g>
    <g transform="translate(286 162)"><rect width="174" height="104" rx="16" fill="#fff"/><text x="20" y="36" fill="#6d28d9" font-size="14" font-weight="700">02 · EXECUTE</text><text x="20" y="72" fill="#111827" font-size="22" font-weight="700">Explore once</text></g>
    <g transform="translate(508 162)"><rect width="174" height="104" rx="16" fill="#fff"/><text x="20" y="36" fill="#6d28d9" font-size="14" font-weight="700">03 · CAPTURE</text><text x="20" y="72" fill="#111827" font-size="22" font-weight="700">Evidence</text></g>
    <g transform="translate(730 162)"><rect width="174" height="104" rx="16" fill="#fff"/><text x="20" y="36" fill="#6d28d9" font-size="14" font-weight="700">04 · VERIFY</text><text x="20" y="72" fill="#111827" font-size="22" font-weight="700">Result</text></g>
    <g transform="translate(952 162)"><rect width="184" height="104" rx="16" fill="url(#accent)"/><text x="20" y="36" fill="#ede9fe" font-size="14" font-weight="700">05 · REVIEW</text><text x="20" y="72" fill="#fff" font-size="22" font-weight="700">YAML Case</text></g>
  </g>
  <g stroke="#a78bfa" stroke-width="4" fill="none"><path d="M246 214h30"/><path d="M468 214h30"/><path d="M690 214h30"/><path d="M912 214h30"/></g>
  <g fill="#a78bfa"><path d="m276 214-10-7v14z"/><path d="m498 214-10-7v14z"/><path d="m720 214-10-7v14z"/><path d="m942 214-10-7v14z"/></g>
  <path d="M1044 278v42H382v-34" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="m382 286-8 12h16z" fill="#8b5cf6"/>
  <text x="426" y="350" fill="#ddd6fe" font-family="system-ui,sans-serif" font-size="18" font-weight="650">DETERMINISTIC REPLAY</text>
  <text x="650" y="350" fill="#9ca3af" font-family="system-ui,sans-serif" font-size="18">same Harness · fresh evidence · no planning LLM</text>
</svg>
