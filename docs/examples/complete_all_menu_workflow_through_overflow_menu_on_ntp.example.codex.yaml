schemaVersion: fsq.ai-test/v1
name: "Example: Complete all menu workflow through overflow menu on NTP"
description: Example strict FSQ case based on a successful dynamic recording. Observation tools such as ui_tree are intentionally not emitted as commands.
platform: android
appId: com.microsoft.emmx
tags:
- example
- android
- overflow-menu
- strict-replay
properties:
  example:
    based_on: complete_all_menu_workflow_through_overflow_menu_on_ntp
    source: dynamic-recording
    notes:
    - Observation snapshots are evidence/audit artifacts, not replay commands.
    - Locators are trimmed to stable fields instead of preserving null recording fields.
onCaseStart:
- runCase: cases/fsq-testcases/android/bottom_bar/access_downloads_through_overflow_menu.codex.yaml
onCaseComplete:
- runShell: echo case complete
---
- launchApp:
    app_id: com.microsoft.emmx
- tapOn:
    target: Add New tab
    locator:
      resourceId: com.microsoft.emmx:id/edge_bottom_bar_plus_button
- assertVisible:
    target: New Tab Page account menu
    locator:
      accessibilityId: Account menu
    optional: false
- tapOn:
    target: Browser menu
    locator:
      resourceId: com.microsoft.emmx:id/overflow_button_bottom
- swipe:
    start:
      x: 800
      y: 2350
    end:
      x: 200
      y: 2350
    reference_screen_size:
      width: 1264
      height: 2744
    duration: 1000
- tapOn:
    target: All Menu
    locator:
      text: All menu
      className: android.widget.TextView
      xpath: //android.widget.TextView[@text='All menu']
- assertVisible:
    target: the All Menu panel should open
    locator:
      xpath: //android.widget.TextView[@text='All Menu']
    optional: false
- tapOn:
    target: Edit
    locator:
      resourceId: com.microsoft.emmx:id/toolbar_button_edit_done
- assertVisible:
    target: The All menu edit mode should be opened
    locator:
      xpath: //android.widget.TextView[@text='Edit Menu']
    optional: false
- assert:
    element:
      xpath: //android.widget.FrameLayout[@resource-id='com.microsoft.emmx:id/grid_item_view'][1]
      enabled: false
    optional: false
- tapOn:
    target: Drop
    locator:
      xpath: //android.widget.TextView[@text='Drop']/..
- tapOn:
    target: Done
    locator:
      text: Done
      className: android.widget.Button
      xpath: //android.widget.Button[@text='Done']
- tapOn:
    target: Back button on All menu panel
    locator:
      resourceId: com.microsoft.emmx:id/back_button
- tapOn:
    target: Browser menu
    locator:
      resourceId: com.microsoft.emmx:id/overflow_button_bottom
- swipe:
    start:
      x: 800
      y: 2350
    end:
      x: 200
      y: 2350
    reference_screen_size:
      width: 1264
      height: 2744
    duration: 1000
- assertNotVisible:
    target: Drop menu item
    locator:
      xpath: //android.widget.TextView[@text='Drop']
    optional: false
- tapOn:
    target: All Menu
    locator:
      text: All menu
      className: android.widget.TextView
      xpath: //android.widget.TextView[@text='All menu']
- tapOn:
    target: Edit
    locator:
      resourceId: com.microsoft.emmx:id/toolbar_button_edit_done
- tapOn:
    target: Drop
    locator:
      xpath: //android.widget.TextView[@text='Drop']/..
- tapOn:
    target: Done
    locator:
      resourceId: com.microsoft.emmx:id/toolbar_button_edit_done
- tapOn:
    target: Back button on All menu panel
    locator:
      resourceId: com.microsoft.emmx:id/back_button
- tapOn:
    target: Browser menu
    locator:
      resourceId: com.microsoft.emmx:id/overflow_button_bottom
- swipe:
    start:
      x: 800
      y: 2350
    end:
      x: 200
      y: 2350
    reference_screen_size:
      width: 1264
      height: 2744
    duration: 1000
- assertVisible:
    target: Drop menu item
    locator:
      xpath: //android.widget.TextView[@text='Drop']
    optional: false
- killApp:
    app_id: com.microsoft.emmx
