openai_agents:
  provider: github_copilot
  tracing_enabled: true

harness:
  platform: android
  android:
    backend: uiautomator2
  # For Web runs, set platform: web and configure:
  # web:
  #   backend: playwright
  #   channel: chrome
  #   headless: false
  #   base_url: null
  # For macOS runs, set platform: macos and configure stable defaults only:
  # macos:
  #   backend: appium_mac2
  #   page_source_max_depth: 12
  #   action_timeout_seconds: 10

execution:
  post_action_delay_seconds:
    platform: 1.0
    common: 0.0

runtime_secrets:
  allowed_env_names:
    - TEST_ACCOUNT_EMAIL
    - TEST_ACCOUNT_PASSWORD

agent_context:
  knowledge:
    root_dir: ./knowledge
    skills:
      dir: skills
      items:
        - name: automation-basics
          description: Semantic action and evidence guidance for local runs.
          kind: markdown
          path: automation-basics.md
          required: true
        - name: android-harness
          description: Android harness action selection and recovery guidance.
          kind: markdown
          path: android-harness.md
          required: true
        # For Web runs, replace android-harness with:
        # - name: web-harness
        #   description: Web harness action selection and recovery guidance.
        #   kind: markdown
        #   path: web-harness.md
        #   required: true
        # For macOS runs, replace android-harness with:
        # - name: macos-harness
        #   description: macOS Appium Mac2 harness action selection and recovery guidance.
        #   kind: markdown
        #   path: macos-harness.md
        #   required: true
    pre_plan:
      dir: project_android_v1
