openai_agents:
  max_turns: 100
  tracing_enabled: true

harness:
  platform: android
  android:
    backend: uiautomator2

execution:
  post_action_delay_seconds:
    platform: 1.0
    common: 0.0

runtime_secrets:
  allowed_env_names:
    - TEST_ACCOUNT_EMAIL
    - TEST_ACCOUNT_PASSWORD

agent_context:
  knowledge:
    root_dir: ./knowledge/project_android_v1
    skills:
      dir: ../skills
      items:
        - name: automation-basics
          description: Semantic action and evidence guidance for local runs.
          kind: markdown
          path: automation-basics.md
          required: true
        - name: android-harness
          description: Android harness action selection and recovery guidance.
          kind: markdown
          path: android-harness.md
          required: true
    pre_plan:
          dir: .