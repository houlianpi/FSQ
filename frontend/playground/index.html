<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FSQ-Agent Playground</title>
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <main class="shell">
      <section class="panel control-panel">
        <header class="topbar">
          <div>
            <h1>FSQ-Agent Playground</h1>
            <p id="server-status" class="status-pill status-connecting">Connecting...</p>
          </div>
          <button id="refresh" class="secondary-button" type="button">Clear</button>
        </header>

        <section id="execution-section" class="section execution-section">
          <div class="section-heading-row">
            <h2>Execution</h2>
            <button id="load-run-toggle" class="secondary-button load-run-toggle" type="button" aria-expanded="false" aria-controls="load-run-form">Load Run</button>
          </div>
          <div id="load-run-form" class="load-run-form" hidden>
            <input id="load-run-path" type="text" placeholder="Run ID or run directory path..." aria-label="Existing run directory" />
            <div class="load-run-actions">
              <button id="load-run-submit" class="primary" type="button">Load</button>
              <button id="load-run-cancel" class="secondary-button" type="button">Cancel</button>
            </div>
            <p id="load-run-status" class="yaml-status" aria-live="polite" hidden></p>
          </div>
          <div class="yaml-tabs" role="tablist" aria-label="YAML views">
            <button id="yaml-input-tab" class="yaml-tab-button active" type="button" role="tab" aria-selected="true" aria-controls="yaml-input-pane">Source YAML</button>
            <button id="yaml-recorded-tab" class="yaml-tab-button" type="button" role="tab" aria-selected="false" aria-controls="yaml-recorded-pane">Generated YAML</button>
            <button id="yaml-progress-tab" class="yaml-tab-button" type="button" role="tab" aria-selected="false" aria-controls="progress-pane">Progress</button>
          </div>
          <div id="yaml-input-pane" class="yaml-pane" role="tabpanel" aria-labelledby="yaml-input-tab">
            <p id="yaml-input-status" class="yaml-status">No YAML loaded.</p>
            <div id="yaml-lifecycle-toolbar" class="yaml-lifecycle-toolbar" hidden>
              <span id="yaml-lifecycle-dirty" class="yaml-lifecycle-dirty" hidden>Unsaved lifecycle changes</span>
              <div class="yaml-lifecycle-toolbar-actions">
                <button id="yaml-lifecycle-save" class="primary" type="button" disabled>Save</button>
                <button id="yaml-lifecycle-discard" class="secondary-button" type="button" disabled>Discard</button>
              </div>
            </div>
            <div id="yaml-input-viewer" class="yaml-viewer" aria-live="polite"></div>
          </div>
          <div id="yaml-recorded-pane" class="yaml-pane" role="tabpanel" aria-labelledby="yaml-recorded-tab" hidden>
            <p id="yaml-recorded-status" class="yaml-status">No generated YAML yet.</p>
            <div id="yaml-recorded-viewer" class="yaml-viewer" aria-live="polite"></div>
          </div>
          <section id="progress-pane" class="yaml-pane progress-pane" role="tabpanel" aria-labelledby="yaml-progress-tab" hidden>
            <div id="progress-run-id" class="progress-run-id" hidden></div>
            <div id="progress" class="progress-log"></div>
          </section>
        </section>

        <section class="section">
          <h2>Session</h2>
          <div class="session-row">
            <select id="device-select" aria-label="ADB device"></select>
          </div>
          <p id="session-message" class="muted"></p>
        </section>

        <section class="section run-section">
          <h2>Run</h2>
          <div class="run-mode-row" role="radiogroup" aria-label="Run mode">
            <label><input type="radio" name="run-mode" value="goal" checked /> Goal</label>
            <label><input type="radio" name="run-mode" value="yaml" /> YAML</label>
            <label><input type="radio" name="run-mode" value="strict-yaml" /> Strict YAML</label>
          </div>
          <div class="run-input-row">
            <textarea id="goal" rows="5" placeholder="Describe the Android task to run..."></textarea>
            <div id="yaml-path-row" class="yaml-path-row" hidden>
              <input id="case-yaml" type="text" placeholder="Path to .codex.yaml..." />
            </div>
            <button id="run-selected" type="button" class="primary">Run</button>
          </div>
        </section>
      </section>

      <div id="panel-resizer" class="panel-resizer" role="separator" aria-label="Resize panels" aria-orientation="vertical" aria-valuemin="300" aria-valuemax="720" tabindex="0"></div>

      <section class="panel preview-panel">
        <header class="preview-header">
          <div>
            <div class="preview-tabs" role="tablist" aria-label="Preview and report">
              <button id="preview-tab" class="tab-button active" type="button" role="tab" aria-selected="true" aria-controls="preview-pane">Preview</button>
              <button id="report-tab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="report-pane">Report</button>
            </div>
          </div>
        </header>
        <div id="preview-pane" class="tab-pane preview-frame" role="tabpanel" aria-labelledby="preview-tab">
          <div id="step-artifact-preview" class="step-artifact-preview" hidden></div>
          <video id="replay-video" controls hidden></video>
          <img id="screenshot" alt="Android screenshot preview" />
          <p id="preview-empty">Screenshot preview will appear here.</p>
        </div>
        <div id="report-pane" class="tab-pane report-pane" role="tabpanel" aria-labelledby="report-tab" hidden>
          <div id="report-content" class="report-content">No report yet.</div>
        </div>
      </section>
    </main>
    <script type="module" src="./playground.js"></script>
  </body>
</html>
