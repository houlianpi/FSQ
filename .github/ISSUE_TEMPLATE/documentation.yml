name: Documentation issue
description: Report unclear, outdated, or missing FSQ documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make FSQ easier to adopt. Please avoid sharing private targets, account details, secrets, local paths, or raw Run evidence that has not been reviewed.

  - type: input
    id: page
    attributes:
      label: Documentation page or section
      description: Link the page or name the section that needs attention.
      placeholder: "For example: README quickstart, docs/getting-started.md, or docs/platform-prerequisites.md"
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is unclear, outdated, or missing?
      description: Describe the problem from a reader's point of view.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What would help?
      description: Suggest the clarification, example, warning, or link that would make the page better.
    validations:
      required: false

  - type: dropdown
    id: audience
    attributes:
      label: Reader type
      description: Select the closest audience for this documentation issue.
      options:
        - First-time user
        - Contributor
        - Maintainer
        - Platform or driver author
        - Other
    validations:
      required: true

  - type: checkboxes
    id: submission-checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the current README and docs index first.
          required: true
        - label: I removed credentials, tokens, account data, personal data, and private paths from this report.
          required: true
